name: Windows EXE Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Diagnose source parser location
        shell: pwsh
        run: |
          $raw = Get-Content .\src\main.jsx -Raw
          Write-Host "main.jsx length: $($raw.Length)"
          $start = [Math]::Max(0, 20950)
          $count = [Math]::Min(500, $raw.Length - $start)
          $raw.Substring($start, $count)
      - name: Build Windows installer and portable EXE
        run: npm run build:win
      - name: Verify EXE output
        shell: pwsh
        run: |
          $files = Get-ChildItem .\release\*.exe
          if (-not $files) { throw 'No EXE artifacts were produced.' }
          $files | Format-Table Name,Length
      - name: Upload Windows EXEs
        uses: actions/upload-artifact@v4
        with:
          name: findupto-pos-windows
          path: release/*.exe
          if-no-files-found: error
